name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# cancel superseded runs of the same branch / PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        experimental: [false]
        include:
          # 3.15 is still a pre-release: run it, but don't fail the whole
          # workflow while parts of the toolchain don't support it yet
          - python-version: "3.15"
            experimental: true

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked

      - name: ruff format
        run: uv run ruff format --check

      - name: ruff check
        run: uv run ruff check

      - name: mypy
        run: uv run mypy

      - name: pyright
        run: uv run pyright

      - name: ty
        run: uv run ty check

      - name: pytest
        run: uv run pytest

  docs:
    name: docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --locked --group docs

      - name: Build documentation (warnings are errors)
        run: uv run --group docs sphinx-build -W --keep-going -b html docs docs/_build/html

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy-docs:
    name: deploy docs
    # publish only what landed on main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: docs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # the Pages site itself was enabled once via
    # `gh api repos/<owner>/<repo>/pages -X POST -f build_type=workflow`;
    # creating it from a workflow is impossible (GITHUB_TOKEN cannot get
    # repo-administration rights)
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
